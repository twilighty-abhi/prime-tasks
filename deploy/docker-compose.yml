# prime-tasks on the office VM: app + Postgres 16 + Caddy (TLS).
# Sized for 20-30 people plus a few agent bots. Suggested VM: 2 vCPU, 4 GB RAM, 40 GB disk.
# Copy .env.example to .env and fill it in before the first `docker compose up -d`.
name: prime-tasks

services:
  prime-tasks:
    image: ghcr.io/twilighty-abhi/prime-tasks:${PRIME_TASKS_VERSION:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      files-permissions:
        condition: service_completed_successfully
    environment:
      VIKUNJA_SERVICE_PUBLICURL: https://${PRIME_DOMAIN:?set PRIME_DOMAIN in .env}/
      VIKUNJA_SERVICE_SECRET: ${VIKUNJA_SERVICE_SECRET:?set VIKUNJA_SERVICE_SECRET in .env}
      VIKUNJA_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./config.yml:/etc/vikunja/config.yml:ro
      - files:/app/vikunja/files
    expose:
      - "3456"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  # The app image runs as uid 1000 and a fresh named volume is root-owned.
  files-permissions:
    image: busybox:1.37
    command: ["chown", "-R", "1000:1000", "/files"]
    volumes:
      - files:/files
    restart: "no"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vikunja
      POSTGRES_DB: vikunja
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command:
      - postgres
      - -c
      - max_connections=60
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vikunja -d vikunja"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - prime-tasks
    environment:
      PRIME_DOMAIN: ${PRIME_DOMAIN:?set PRIME_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 256m

# Fixed names so backup.sh and docs can address them regardless of the directory name.
volumes:
  pgdata:
    name: prime-tasks-pgdata
  files:
    name: prime-tasks-files
  caddy_data:
    name: prime-tasks-caddy-data
  caddy_config:
    name: prime-tasks-caddy-config
