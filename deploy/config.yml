# prime-tasks config for the office VM (mounted at /etc/vikunja/config.yml).
# Secrets and the public URL come from .env through docker-compose.yml:
#   VIKUNJA_SERVICE_PUBLICURL, VIKUNJA_SERVICE_SECRET, VIKUNJA_DATABASE_PASSWORD,
#   VIKUNJA_AUTH_OPENID_PROVIDERS_GOOGLE_CLIENTID, VIKUNJA_AUTH_OPENID_PROVIDERS_GOOGLE_CLIENTSECRET
# Full reference: config.yml.sample at the repo root (generated, don't edit).

service:
  interface: ":3456"
  timezone: "Asia/Kolkata"
  # Accounts come from Google sign-in (first sign-in creates the account) or an admin (`vikunja user create`).
  enableregistration: false
  # Phase 0
  enablepublicteams: true
  enablelinksharing: false
  # prime-tasks F1: teammates find each other by part of a name, username or email
  orgdirectory: true
  # prime-tasks F6: add new users to teams by their email domain. Create the teams first,
  # then put their ids here (Teams page URL: /teams/<id>/edit).
  # autojointeams:
  #   - domain: "example.org"
  #     team_id: 1
  # Caddy sits in front on the compose network
  ipextractionmethod: "xff"
  trustedproxies: "172.16.0.0/12"

database:
  type: "postgres"
  host: "db:5432"
  user: "vikunja"
  database: "vikunja"
  # Postgres max_connections is 60 in docker-compose.yml
  maxopenconnections: 40
  maxidleconnections: 10

files:
  basepath: "/app/vikunja/files"
  maxsize: "50MB"

defaultsettings:
  # Phase 0: new accounts can be found by teammates. Existing accounts: see sql/flip-discoverable.sql
  discoverable_by_name: true
  discoverable_by_email: true

mailer:
  enabled: false
  # host: "smtp.example.org"
  # port: 587
  # username: ""
  # password: ""  # prefer VIKUNJA_MAILER_PASSWORD in .env
  # fromemail: "tasks@example.org"

log:
  level: "INFO"

auth:
  local:
    enabled: true
    # prime-tasks G1: the login page leads with "Sign in with Google"; username and password
    # sit under "Other ways to sign in" (admin-created accounts and agent bots still use them).
    foldonlogin: true
  openid:
    enabled: true
    # Google sign-in (G1). Redirect URI to register in Google Cloud: https://<PRIME_DOMAIN>/auth/openid/google
    # (see README.md, "Google sign-in"). The client id and secret come from .env (PRIME_GOOGLE_CLIENT_ID,
    # PRIME_GOOGLE_CLIENT_SECRET); docker-compose.yml passes them in as
    # VIKUNJA_AUTH_OPENID_PROVIDERS_GOOGLE_CLIENTID / _CLIENTSECRET, which fill in the two keys missing here.
    providers:
      google:
        name: "Google"
        authurl: "https://accounts.google.com"
        scope: "openid email profile"
        # A verified Google email signs in to the account an admin already created for it.
        emailfallback: true
        usernamefallback: true
        # F7: new users get the email's local part as username (abhiram, abhiram2 on a clash)
        usernamefromemail: true
